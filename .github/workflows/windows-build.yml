name: Build Windows app
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:app
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: Kaarnegar-Windows
          path: |
            release/Kaarnegar-Setup-*.exe
            release/Kaarnegar.exe
          if-no-files-found: error
